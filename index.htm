<head>

body {

		.vertical-text {
			float:right;
			writing-mode: vertical-rl; /* 縦書き、右から左 */
			text-align: top right; /* 文字の水平方向の揃え */
			font-family: '明朝', serif; /* フォントを明朝体に設定 */

			/*height: auto;*/
			height:90%;
			/*display: flex; /* フレックスボックスを使用 */

			justify-content: flex-start; /* 上端に揃える */
			overflow-x: auto; /* 横方向にスクロールバーを表示 */
			width: 100%; /* 親要素の幅に合わせて広げる */

			text-orientation: upright; /* 数字を横向きに */

      word-break:break-all;
		}

				height:20%
				padding: 10px;
			}

				font-size: 20px; /* 文字サイズを調整 */
			}
		}
	</style>

</head>
<body>

  <div>
    <input type="text" id="search-box" placeholder="キーワードを入力してください" />
    <button onclick="filterTable()">検索</button>
  </div>


  <div class="vertical-text">
<table id="quotes-table">

  <!-- ... 略 ... -->

</table>    
  </div>
  <script src="script.js"></script>

  <script>
    // フィルタリング関数。検索語を URL の q パラメータに反映します。
    function filterTable() {
        const searchBox = document.getElementById('search-box');
        const query = searchBox.value;
        const keywords = query.toLowerCase().split(/[ 　]/).filter(keyword => keyword);
        const table = document.getElementById('quotes-table');
        const rows = table.getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const rowText = row.innerText.toLowerCase();
            const containsAllKeywords = keywords.every(keyword => rowText.includes(keyword));

            if (containsAllKeywords) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        }

        // URL の q パラメータを更新（履歴を置き換え、ページ遷移させない）
        try {
            const params = new URLSearchParams(window.location.search);
            if (query && query.trim().length > 0) {
                params.set('q', query);
            } else {
                params.delete('q');
            }
            const newSearch = params.toString();
            const newUrl = window.location.pathname + (newSearch ? ('?' + newSearch) : '') + window.location.hash;
            history.replaceState(null, '', newUrl);
        } catch (e) {
            // 古いブラウザでは URLSearchParams がないことがあるが、これは無視してよい
            console.warn('URL update failed', e);
        }
    }

    // ページ読み込み時に q パラメータがあれば検索ボックスにセットしてフィルタ実行
    document.addEventListener('DOMContentLoaded', function() {
        const searchBox = document.getElementById('search-box');
        try {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q !== null) {
                // デコード済みの q をそのまま入れる（+ がスペースに変換されるため注意）
                searchBox.value = q;
                // キーワードが空でなければフィルタを実行
                if (q.trim().length > 0) filterTable();
            }
        } catch (e) {
            // 無視
        }

        // Enter キーで検索を実行できるように
        searchBox.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') filterTable();
        });
    });
  </script>


</body>
</html>
